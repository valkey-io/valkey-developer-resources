name: Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**"
  schedule:
    - cron: "0 9 * * 1" # Weekly on Monday at 9am UTC — catches dependency breakage

jobs:
  discover-cookbooks:
    runs-on: ubuntu-latest
    outputs:
      node-cookbooks: ${{ steps.discover.outputs.node-cookbooks }}
      python-cookbooks: ${{ steps.discover.outputs.python-cookbooks }}
      go-cookbooks: ${{ steps.discover.outputs.go-cookbooks }}
      has-node: ${{ steps.discover.outputs.has-node }}
      has-python: ${{ steps.discover.outputs.has-python }}
      has-go: ${{ steps.discover.outputs.has-go }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: |
          # Discover Node cookbooks (directories containing package.json under cookbooks/**/sample/)
          node_cookbooks=$(find cookbooks -path "*/sample/package.json" -exec dirname {} \; | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "node-cookbooks=$node_cookbooks" >> $GITHUB_OUTPUT
          if [ "$node_cookbooks" != "[]" ]; then
            echo "has-node=true" >> $GITHUB_OUTPUT
          else
            echo "has-node=false" >> $GITHUB_OUTPUT
          fi

          # Discover Python cookbooks (directories containing requirements.txt under cookbooks/**/sample/)
          python_cookbooks=$(find cookbooks -path "*/sample/requirements.txt" -exec dirname {} \; | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "python-cookbooks=$python_cookbooks" >> $GITHUB_OUTPUT
          if [ "$python_cookbooks" != "[]" ]; then
            echo "has-python=true" >> $GITHUB_OUTPUT
          else
            echo "has-python=false" >> $GITHUB_OUTPUT
          fi

          # Discover Go cookbooks (directories containing go.mod under cookbooks/**/sample/).
          go_cookbooks=$(find cookbooks -path "*/sample/go.mod" -exec dirname {} \; | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "go-cookbooks=$go_cookbooks" >> $GITHUB_OUTPUT
          if [ "$go_cookbooks" != "[]" ]; then
            echo "has-go=true" >> $GITHUB_OUTPUT
          else
            echo "has-go=false" >> $GITHUB_OUTPUT
          fi

  node-typecheck:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.node-cookbooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: npm ci
      - name: Lint
        working-directory: ${{ matrix.cookbook }}
        run: |
          if npx eslint --version >/dev/null 2>&1; then
            npx eslint . --max-warnings 0
          else
            echo "No eslint configured — skipping lint"
          fi
      - name: Type check
        working-directory: ${{ matrix.cookbook }}
        run: npx tsc --noEmit
      - name: Audit dependencies (informational)
        working-directory: ${{ matrix.cookbook }}
        continue-on-error: true
        run: npm audit --audit-level=high

  node-integration-test:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.node-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: npm ci
      - name: Run integration tests (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        run: npm test

  python-lint:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.python-cookbooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint with ruff
        working-directory: ${{ matrix.cookbook }}
        run: ruff check .
      - name: Type check with ruff (basic)
        working-directory: ${{ matrix.cookbook }}
        continue-on-error: true
        run: ruff check --select=F,E .

  python-integration-test:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.python-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration tests (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        run: |
          if [ -f pytest.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            pip install pytest pytest-asyncio
            pytest
          elif ls test_*.py 1>/dev/null 2>&1 || ls *_test.py 1>/dev/null 2>&1; then
            pip install pytest pytest-asyncio
            pytest
          else
            # Fall back to running main.py if no test framework detected
            python main.py
          fi

  go-build-vet:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-go == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.go-cookbooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.cookbook }}/go.mod
      - name: Build
        working-directory: ${{ matrix.cookbook }}
        run: go build ./...
      - name: Vet
        working-directory: ${{ matrix.cookbook }}
        run: go vet ./...
      - name: Format check
        working-directory: ${{ matrix.cookbook }}
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  vllm-semantic-router-config-validation:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The router's configuration validator is distributed as the Python vllm-sr CLI;
      # it validates the config.yaml consumed by this Go HTTP client sample.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Semantic Router configuration
        working-directory: cookbooks/framework-integrations/go/vllm-semantic-router/sample
        run: |
          python -m pip install "vllm-sr==0.3.0"
          vllm-sr validate

  go-integration-test:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.go-cookbooks) }}
        valkey-version: ["9.1.2"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.cookbook }}/go.mod
      - name: Run Go tests (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        env:
          VALKEY_HOST: 127.0.0.1
        run: go test -v ./...
