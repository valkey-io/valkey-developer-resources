name: Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**"
  schedule:
    - cron: "0 9 * * 1" # Weekly on Monday at 9am UTC — catches dependency breakage

jobs:
  discover-cookbooks:
    runs-on: ubuntu-latest
    outputs:
      node-cookbooks: ${{ steps.discover.outputs.node-cookbooks }}
      python-cookbooks: ${{ steps.discover.outputs.python-cookbooks }}
      has-node: ${{ steps.discover.outputs.has-node }}
      has-python: ${{ steps.discover.outputs.has-python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: |
          # Discover Node cookbooks (directories containing package.json under cookbooks/**/sample/)
          node_cookbooks=$(find cookbooks -path "*/sample/package.json" -exec dirname {} \; | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "node-cookbooks=$node_cookbooks" >> $GITHUB_OUTPUT
          if [ "$node_cookbooks" != "[]" ]; then
            echo "has-node=true" >> $GITHUB_OUTPUT
          else
            echo "has-node=false" >> $GITHUB_OUTPUT
          fi

          # Discover Python cookbooks (directories containing requirements.txt under cookbooks/**/sample/)
          python_cookbooks=$(find cookbooks -path "*/sample/requirements.txt" -exec dirname {} \; | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "python-cookbooks=$python_cookbooks" >> $GITHUB_OUTPUT
          if [ "$python_cookbooks" != "[]" ]; then
            echo "has-python=true" >> $GITHUB_OUTPUT
          else
            echo "has-python=false" >> $GITHUB_OUTPUT
          fi

  node-typecheck:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.node-cookbooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: npm ci
      - name: Type check
        working-directory: ${{ matrix.cookbook }}
        run: npx tsc --noEmit
      - name: Audit dependencies (informational)
        working-directory: ${{ matrix.cookbook }}
        continue-on-error: true
        run: npm audit --audit-level=high

  node-integration-test:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.node-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: npm ci
      - name: Run integration tests (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        run: npm test

  python-lint:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.python-cookbooks) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint with ruff
        working-directory: ${{ matrix.cookbook }}
        run: ruff check .
      - name: Type check with ruff (basic)
        working-directory: ${{ matrix.cookbook }}
        continue-on-error: true
        run: ruff check --select=F,E .

  python-integration-test:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.python-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: ${{ matrix.cookbook }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run integration tests (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        run: |
          if [ -f pytest.ini ] || [ -f setup.cfg ] || [ -f pyproject.toml ]; then
            pip install pytest pytest-asyncio
            pytest
          elif ls test_*.py 1>/dev/null 2>&1 || ls *_test.py 1>/dev/null 2>&1; then
            pip install pytest pytest-asyncio
            pytest
          else
            # Fall back to running main.py if no test framework detected
            python main.py
          fi
