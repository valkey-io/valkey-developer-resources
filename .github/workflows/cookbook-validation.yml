name: Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**"
      - ".github/workflows/cookbook-validation.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**"
      - ".github/workflows/cookbook-validation.yml"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/**/pyproject.toml'
              - 'cookbooks/**/tests/**/*.py'
              - 'cookbooks/**/scripts/**/*.py'

  python-integration-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: [langflow]
        valkey-version: ["8.1.1", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v5
        with:
          version: "0.7"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cookbooks/framework-integrations/${{ matrix.cookbook }}/sample
        run: |
          uv venv
          uv pip install -e ".[test]"
      - name: Run integration tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/framework-integrations/${{ matrix.cookbook }}/sample
        run: .venv/bin/pytest tests/ -v --timeout=60

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check relative links in markdown
        run: |
          errors=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            grep -oP '\[.*?\]\(\K[^)]+' "$file" | while read -r link; do
              # Skip external URLs and anchors
              if [[ "$link" =~ ^https?:// ]] || [[ "$link" =~ ^# ]]; then
                continue
              fi
              # Strip anchor from relative links
              clean_link="${link%%#*}"
              if [ -n "$clean_link" ] && [ ! -e "$dir/$clean_link" ]; then
                echo "::error file=$file::Broken link: $link"
                errors=$((errors + 1))
              fi
            done
          done < <(find cookbooks -name '*.md' -type f)
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken link(s)"
            exit 1
          fi

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: DavidAnson/markdownlint-cli2-action@db4f23e79b1caa3f9949bac3e71f03aa0e23d524 # v19
        with:
          globs: "cookbooks/**/*.md"
