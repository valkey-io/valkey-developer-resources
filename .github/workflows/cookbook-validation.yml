name: Cookbook Validation

# Cookbooks are Jupyter notebooks (.ipynb) whatever the language. This workflow
# discovers each cookbook by the language manifest that sits alongside its
# notebooks, then executes every notebook end-to-end against a Valkey service
# container on the matching Jupyter kernel. A cell that raises fails the build,
# so the code a reader runs is the code CI runs.

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**"
  schedule:
    - cron: "0 9 * * 1" # Weekly on Monday at 9am UTC — catches dependency breakage

# Restrict the workflow token to the minimum: it only checks out code and runs
# builds. Limits blast radius if a dependency or action is compromised.
permissions:
  contents: read

jobs:
  discover-cookbooks:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.discover.outputs.python-cookbooks }}
      node-cookbooks: ${{ steps.discover.outputs.node-cookbooks }}
      go-cookbooks: ${{ steps.discover.outputs.go-cookbooks }}
      java-cookbooks: ${{ steps.discover.outputs.java-cookbooks }}
      has-python: ${{ steps.discover.outputs.has-python }}
      has-node: ${{ steps.discover.outputs.has-node }}
      has-go: ${{ steps.discover.outputs.has-go }}
      has-java: ${{ steps.discover.outputs.has-java }}
      has-vllm-router: ${{ steps.discover.outputs.has-vllm-router }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: discover
        run: |
          # A cookbook is a directory that contains at least one .ipynb notebook.
          # Its language is determined by the dependency manifest sitting alongside
          # the notebooks (see CONTRIBUTING.md "Cookbook Structure"):
          #   pyproject.toml   -> Python    package.json -> Node/TS
          #   go.mod           -> Go        pom.xml      -> Java
          #
          # discover_lang <output-name> <manifest-filename>
          # emits "<name>-cookbooks=<json-array>" and "has-<name>=true|false"
          discover_lang() {
            name="$1"; manifest="$2"
            dirs=$(find cookbooks -name "$manifest" -not -path "*/node_modules/*" \
              -exec dirname {} \; \
              | while read -r d; do
                  # only count it as a cookbook if a notebook lives alongside the manifest
                  if ls "$d"/*.ipynb >/dev/null 2>&1; then echo "$d"; fi
                done \
              | sort -u \
              | jq -R -s -c 'split("\n") | map(select(length > 0))')
            echo "${name}-cookbooks=$dirs" >> "$GITHUB_OUTPUT"
            if [ "$dirs" != "[]" ]; then
              echo "has-${name}=true" >> "$GITHUB_OUTPUT"
            else
              echo "has-${name}=false" >> "$GITHUB_OUTPUT"
            fi
          }

          discover_lang python pyproject.toml
          discover_lang node   package.json
          discover_lang go     go.mod
          discover_lang java   pom.xml

          # Optional per-cookbook extra: the vLLM Semantic Router config validator
          # only applies when that specific cookbook's config.yaml is present.
          vllm_config=cookbooks/framework-integrations/go/vllm-semantic-router/config.yaml
          if [ -f "$vllm_config" ]; then
            echo "has-vllm-router=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-vllm-router=false" >> "$GITHUB_OUTPUT"
            # Warn (don't fail) so a renamed/relocated cookbook is noticed rather
            # than silently skipping the config-validation job.
            echo "::warning::vLLM Semantic Router config not found at $vllm_config — its config-validation job will be skipped. If the cookbook moved, update this path."
          fi

  # ---------------------------------------------------------------------------
  # Python notebooks
  # ---------------------------------------------------------------------------
  python-notebooks:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.python-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.2"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install cookbook dependencies
        working-directory: ${{ matrix.cookbook }}
        run: |
          # uv sync reads pyproject.toml + uv.lock: it provisions the pinned
          # Python, the cookbook's runtime deps, and its dev group (pytest, etc.).
          # requires-python in pyproject keeps the interpreter reproducible too.
          uv sync
      - name: Lint notebooks with ruff
        working-directory: ${{ matrix.cookbook }}
        # ruff and the notebook-execution toolchain (nbmake/jupyter) are shared
        # CI tooling rather than cookbook deps, so run them with `uv run --with`
        # at pinned versions inside the synced environment.
        run: uv run --with ruff==0.11.13 ruff check .
      - name: Execute notebooks (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        env:
          VALKEY_HOST: 127.0.0.1
          VALKEY_PORT: "6379"
        run: >-
          uv run
          --with nbmake==1.5.5
          --with jupyter==1.1.1
          --with nbconvert==7.17.1
          pytest --nbmake --nbmake-timeout=600 ./*.ipynb
      - name: Run cookbook tests (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        env:
          VALKEY_HOST: 127.0.0.1
          VALKEY_PORT: "6379"
        # Standalone test_*.py files (e.g. config + compose-wiring checks) run
        # here, not through nbmake. These catch drift between a cookbook's
        # documented config and what its compose file actually passes. Tests
        # needing the full runtime stack skip themselves when it isn't up, so
        # the structural tier still runs against the Valkey service container.
        # Skip cleanly when a cookbook ships no such tests.
        run: |
          if ls test_*.py >/dev/null 2>&1; then
            uv run pytest -v test_*.py
          else
            echo "No standalone test_*.py in this cookbook — skipping."
          fi

  # ---------------------------------------------------------------------------
  # Node / TypeScript notebooks (tslab kernel)
  # ---------------------------------------------------------------------------
  node-notebooks:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-node == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.node-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.2"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install cookbook dependencies
        working-directory: ${{ matrix.cookbook }}
        run: npm ci
      - name: Lint (if eslint is configured)
        working-directory: ${{ matrix.cookbook }}
        run: |
          if npx --no-install eslint --version >/dev/null 2>&1; then
            npx eslint . --max-warnings 0
          else
            echo "No eslint configured — skipping lint"
          fi
      - name: Install Jupyter and the tslab (TypeScript/JavaScript) kernel
        working-directory: ${{ matrix.cookbook }}
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/.github/workflows/notebook-toolchain-requirements.txt"
          npm install -g tslab@1.0.22
          tslab install --version
          tslab install
      - name: Execute notebooks (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        env:
          VALKEY_HOST: 127.0.0.1
          VALKEY_PORT: "6379"
        run: |
          for nb in ./*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 \
              --output /tmp/executed.ipynb "$nb"
          done

  # ---------------------------------------------------------------------------
  # Go notebooks (gophernotes kernel)
  # ---------------------------------------------------------------------------
  go-notebooks:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.go-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.2"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          go-version: "1.24"
          cache-dependency-path: ${{ matrix.cookbook }}/go.mod
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Format check any Go helper files
        working-directory: ${{ matrix.cookbook }}
        run: |
          unformatted=$(gofmt -l . || true)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
      - name: Install Jupyter and the gophernotes (Go) kernel
        working-directory: ${{ matrix.cookbook }}
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/.github/workflows/notebook-toolchain-requirements.txt"
          go install github.com/gopherdata/gophernotes@v0.7.5
          mkdir -p "$HOME/.local/share/jupyter/kernels/gophernotes"
          cd "$HOME/.local/share/jupyter/kernels/gophernotes"
          cp "$(go env GOPATH)/pkg/mod/github.com/gopherdata/gophernotes@v0.7.5/kernel/"* .
          sed "s|gophernotes|$(go env GOPATH)/bin/gophernotes|" < kernel.json.in > kernel.json
      - name: Execute notebooks (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        env:
          VALKEY_HOST: 127.0.0.1
          VALKEY_PORT: "6379"
        run: |
          for nb in ./*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 \
              --output /tmp/executed.ipynb "$nb"
          done

  # ---------------------------------------------------------------------------
  # Java notebooks (IJava kernel)
  # ---------------------------------------------------------------------------
  java-notebooks:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-java == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cookbook: ${{ fromJson(needs.discover-cookbooks.outputs.java-cookbooks) }}
        valkey-version: ["8.1.7", "9.1.2"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install Jupyter and the IJava kernel
        run: |
          python -m pip install --upgrade pip
          pip install -r "$GITHUB_WORKSPACE/.github/workflows/notebook-toolchain-requirements.txt"
          IJAVA_VERSION=1.3.0
          IJAVA_SHA256=484cc62579cb77510b0f0c78283f043794396d8ae9d76a8f2ab5d7368ec246b2
          curl -fsSL -o /tmp/ijava.zip \
            "https://github.com/SpencerPark/IJava/releases/download/v${IJAVA_VERSION}/ijava-${IJAVA_VERSION}.zip"
          echo "${IJAVA_SHA256}  /tmp/ijava.zip" | sha256sum -c -
          unzip -q /tmp/ijava.zip -d /tmp/ijava
          python /tmp/ijava/install.py --user
      - name: Execute notebooks (Valkey ${{ matrix.valkey-version }})
        working-directory: ${{ matrix.cookbook }}
        env:
          VALKEY_HOST: 127.0.0.1
          VALKEY_PORT: "6379"
        run: |
          for nb in ./*.ipynb; do
            echo "Executing $nb"
            jupyter nbconvert --to notebook --execute --ExecutePreprocessor.timeout=600 \
              --output /tmp/executed.ipynb "$nb"
          done

  # ---------------------------------------------------------------------------
  # Optional per-cookbook extras
  # ---------------------------------------------------------------------------
  # The vLLM Semantic Router cookbook ships a config.yaml consumed by its
  # notebooks; the router's validator is the Python vllm-sr CLI. This job only
  # runs when that specific config file exists (discovered above), so it never
  # blocks unrelated cookbooks (guarded per Jonathan's review).
  vllm-semantic-router-config-validation:
    needs: discover-cookbooks
    if: needs.discover-cookbooks.outputs.has-vllm-router == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate Semantic Router configuration
        working-directory: cookbooks/framework-integrations/go/vllm-semantic-router
        run: |
          python -m pip install "vllm-sr==0.3.0"
          vllm-sr validate
