name: "Cookbook: Langflow Integration Tests"

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/langflow/sample/**"
      - "cookbooks/framework-integrations/langflow/*.md"
      - ".github/workflows/cookbook-langflow.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/langflow/sample/**"
      - "cookbooks/framework-integrations/langflow/*.md"
      - ".github/workflows/cookbook-langflow.yml"

permissions:
  contents: read

jobs:
  python-integration-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        valkey-version: ["8.1.1", "9.1.0"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v5
        with:
          version: "0.7"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: cookbooks/framework-integrations/langflow/sample
        run: |
          uv venv
          uv pip install -e ".[test]"
      - name: Run integration tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/framework-integrations/langflow/sample
        run: .venv/bin/pytest tests/ -v --timeout=60

  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Check relative links in markdown
        run: |
          errors=0
          while IFS= read -r file; do
            dir=$(dirname "$file")
            while IFS= read -r link; do
              # Skip external URLs and anchors
              if [[ "$link" =~ ^https?:// ]] || [[ "$link" =~ ^# ]]; then
                continue
              fi
              # Strip anchor from relative links
              clean_link="${link%%#*}"
              if [ -n "$clean_link" ] && [ ! -e "$dir/$clean_link" ]; then
                echo "::error file=$file::Broken link: $link"
                errors=$((errors + 1))
              fi
            done < <(grep -oP '\[.*?\]\(\K[^)]+' "$file")
          done < <(find cookbooks/framework-integrations/langflow -name '*.md' -type f)
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors broken link(s)"
            exit 1
          fi

  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: DavidAnson/markdownlint-cli2-action@6bf21b07787794f89a243495939cd651942aeabe # v24
        with:
          globs: "cookbooks/framework-integrations/langflow/**/*.md"
