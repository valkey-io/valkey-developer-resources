name: "Cookbook: DocsGPT Integration Tests"

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/docsgpt/sample/**"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/docsgpt/sample/**"

jobs:
  python-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        valkey-version: ["8.1.1", "9.1.0"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: cookbooks/framework-integrations/docsgpt/sample
        run: pip install -e ".[test]"
      - name: Run integration tests
        working-directory: cookbooks/framework-integrations/docsgpt/sample
        run: pytest -v tests/
