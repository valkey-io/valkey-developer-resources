name: "Cookbook: KServe Integration Tests"

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/kserve/sample/**"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/kserve/sample/**"

jobs:
  python-integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        valkey-version: ["9.1.0"]
    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v5
      - name: Install dependencies
        working-directory: cookbooks/framework-integrations/kserve/sample
        run: uv venv && uv pip install -e ".[test]"
      - name: Run integration tests
        working-directory: cookbooks/framework-integrations/kserve/sample
        run: .venv/bin/pytest tests/ -v
