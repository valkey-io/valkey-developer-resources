# TODO: Remove this temporary copy after PR #43's shared cookbook-validation workflow
# merges and includes framework-integrations/vercel in its matrix.
name: Cookbook TypeScript Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/vercel/**"
      - ".github/workflows/cookbook-ts.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/vercel/**"
      - ".github/workflows/cookbook-ts.yml"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      ts-cookbooks: ${{ steps.filter.outputs.ts-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            ts-cookbooks:
              - 'cookbooks/framework-integrations/vercel/**'
              - '.github/workflows/cookbook-ts.yml'

  node-typecheck:
    needs: detect-changes
    if: needs.detect-changes.outputs.ts-cookbooks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cookbook: [framework-integrations/vercel]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/package-lock.json
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: npm ci
        timeout-minutes: 5
      - name: Type check
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: npx tsc --noEmit

  node-test:
    needs: detect-changes
    if: needs.detect-changes.outputs.ts-cookbooks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cookbook: [framework-integrations/vercel]
        valkey-version: ["8.1.1"]
    services:
      valkey:
        image: valkey/valkey:${{ matrix.valkey-version }}
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/package-lock.json
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: npm ci
        timeout-minutes: 5
      - name: Run tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: npm test
