# TODO: Remove this temporary copy and add framework-integrations/haystack
# to PR #45's shared Python matrix after PR #45 merges.
name: Python Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/*.md"
      - "cookbooks/**/requirements.txt"
      - "cookbooks/**/docker-compose.yml"
      - ".github/workflows/cookbook-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/*.md"
      - "cookbooks/**/requirements.txt"
      - "cookbooks/**/docker-compose.yml"
      - ".github/workflows/cookbook-python.yml"

jobs:
  detect-python-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/**/requirements.txt'
              - 'cookbooks/**/*.py'
              - 'cookbooks/**/*.md'
              - 'cookbooks/**/docker-compose.yml'
              - '.github/workflows/cookbook-python.yml'

  python-lint:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        cookbook: [framework-integrations/haystack]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: timeout 300s python -m pip install -r requirements.txt
      - name: Lint with ruff
        run: |
          timeout 120s python -m pip install ruff==0.11.13
          ruff check --output-format=github cookbooks/${{ matrix.cookbook }}/sample/

  python-integration-test:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cookbook: [framework-integrations/haystack]
        valkey-version: ["8.1.4", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 127.0.0.1:6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: timeout 300s python -m pip install -r requirements.txt
      - name: Run tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: python -m pytest test_haystack.py -v
