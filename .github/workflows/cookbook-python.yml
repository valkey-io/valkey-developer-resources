name: Python Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/requirements.txt"
      - ".github/workflows/cookbook-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/requirements.txt"
      - ".github/workflows/cookbook-python.yml"

jobs:
  detect-python-changes:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/**/requirements.txt'
              - 'cookbooks/**/*.py'
              - '.github/workflows/cookbook-python.yml'

  python-lint:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cookbook: [framework-integrations/metagpt]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: timeout 300s python -m pip install -r requirements.txt
      - name: Lint with ruff (informational)
        continue-on-error: true
        run: |
          pip install ruff==0.11.13
          ruff check --output-format=github cookbooks/${{ matrix.cookbook }}/sample/

  python-integration-test:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cookbook: [framework-integrations/metagpt]
        valkey-version: ["9.1.0"]
        # NOTE: this cookbook's FT.CREATE schema (see sample/valkey_vector_store.py)
        # indexes four TEXT fields (text, doc_id, ref_doc_id, metadata) alongside
        # the VECTOR field. Verified this session: valkey/valkey-bundle:8.1.8 ships
        # valkey-search module v1.0.0, while valkey/valkey-bundle:9.1.0 ships v1.2.0.
        # Confirm against your own bundle version before assuming an 8.x deployment
        # works — if valkey-search v1.0.0 rejects TEXT fields the way it rejects
        # SORTBY/DIALECT in the sibling chatdev cookbook, 8.x would fail here too.
        # Only 9.1.0 is verified and tested in this matrix; add an 8.x entry only
        # after confirming TEXT field support on that bundle's valkey-search build.
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: timeout 300s python -m pip install -r requirements.txt
      - name: Run tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: python -m pytest test_valkey_vector_store.py -v
