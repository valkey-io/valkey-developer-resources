# TODO: Remove this temporary copy after PR #45's shared Python workflow is
# merged and includes framework-integrations/stagehand-python.
name: Python Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/stagehand-python/**"
      - ".github/workflows/cookbook-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/framework-integrations/stagehand-python/**"
      - ".github/workflows/cookbook-python.yml"

jobs:
  detect-python-changes:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/framework-integrations/stagehand-python/**'
              - '.github/workflows/cookbook-python.yml'

  python-integration-test:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        cookbook: [framework-integrations/stagehand-python]
        valkey-version: ["8.1.7", "9.1.0"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: pip install -r requirements.txt
        timeout-minutes: 5
      - name: Run tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: python -m pytest test_valkey_cache_config.py -v
