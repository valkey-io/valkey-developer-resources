name: Python Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/requirements.txt"
      - ".github/workflows/cookbook-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/requirements.txt"
      - ".github/workflows/cookbook-python.yml"

jobs:
  detect-python-changes:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/**/requirements.txt'
              - 'cookbooks/**/*.py'

  python-lint:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cookbook: [use-cases/semantic-caching, framework-integrations/haystack]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: pip install -r requirements.txt
      - name: Lint with ruff (informational)
        continue-on-error: true
        run: |
          pip install ruff==0.11.13
          ruff check --output-format=github cookbooks/${{ matrix.cookbook }}/sample/

  python-integration-test:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Semantic caching requires valkey-search module (only in bundle 9.x+)
          - cookbook: use-cases/semantic-caching
            valkey-image: valkey/valkey-bundle:9.1.0
            test-file: test_cache.py
          # Haystack uses ValkeyDocumentStore (requires search + json modules)
          - cookbook: framework-integrations/haystack
            valkey-image: valkey/valkey-bundle:8.1.4
            test-file: test_haystack.py
          - cookbook: framework-integrations/haystack
            valkey-image: valkey/valkey-bundle:9.1.1
            test-file: test_haystack.py
    services:
      valkey:
        image: ${{ matrix.valkey-image }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: pip install -r requirements.txt
      - name: Run tests (${{ matrix.valkey-image }})
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: python -m pytest ${{ matrix.test-file }} -v
