name: Python Cookbook Validation

# TODO(PR #45): remove this temporary local copy after the shared Python
# cookbook workflow merges, then add this path to that owner workflow.

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/requirements.txt"
      - "cookbooks/**/docker-compose.yml"
      - ".github/workflows/cookbook-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**/*.py"
      - "cookbooks/**/requirements.txt"
      - "cookbooks/**/docker-compose.yml"
      - ".github/workflows/cookbook-python.yml"

jobs:
  detect-python-changes:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/**/requirements.txt'
              - 'cookbooks/**/*.py'
              - 'cookbooks/**/docker-compose.yml'

  python-lint:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cookbook: [framework-integrations/strands]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/framework-integrations/strands/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/framework-integrations/strands/sample
        run: pip install -r requirements.txt
      - name: Lint with ruff (informational)
        continue-on-error: true
        run: |
          pip install ruff==0.11.13
          ruff check --output-format=github cookbooks/framework-integrations/strands/sample/

  python-integration-test:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLLAMA_HOST: http://127.0.0.1:11434
      OLLAMA_MODEL: llama3.2:1b
    strategy:
      fail-fast: false
      matrix:
        cookbook: [framework-integrations/strands]
        valkey-version: ["8.1.4", "9.1.1"]
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      ollama:
        image: ollama/ollama:0.12.6
        ports:
          - 11434:11434
        options: >-
          --health-cmd "ollama list"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/framework-integrations/strands/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/framework-integrations/strands/sample
        run: pip install -r requirements.txt
      - name: Pull Ollama model
        run: |
          curl --fail --retry 12 --retry-all-errors \
            -H "Content-Type: application/json" \
            -d "{\"name\":\"${OLLAMA_MODEL}\",\"stream\":false}" \
            "${OLLAMA_HOST}/api/pull"
      - name: Run tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/framework-integrations/strands/sample
        run: python -m pytest -q
