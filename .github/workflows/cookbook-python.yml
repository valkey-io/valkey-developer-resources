# TODO (local-only, PR #45): Remove this copy when PR #45 is merged.

name: Python Cookbook Validation

on:
  push:
    branches: [main]
    paths:
      - "cookbooks/**/*.md"
      - "cookbooks/**/sample/**/*.py"
      - "cookbooks/**/requirements.txt"
      - "cookbooks/**/docker-compose.yml"
      - "cookbooks/**/compose.yml"
      - ".github/workflows/cookbook-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "cookbooks/**/*.md"
      - "cookbooks/**/sample/**/*.py"
      - "cookbooks/**/requirements.txt"
      - "cookbooks/**/docker-compose.yml"
      - "cookbooks/**/compose.yml"
      - ".github/workflows/cookbook-python.yml"

jobs:
  detect-python-changes:
    runs-on: ubuntu-latest
    outputs:
      python-cookbooks: ${{ steps.filter.outputs.python-cookbooks }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            python-cookbooks:
              - 'cookbooks/**/*.md'
              - 'cookbooks/**/sample/**/*.py'
              - 'cookbooks/**/requirements.txt'
              - 'cookbooks/**/docker-compose.yml'
              - 'cookbooks/**/compose.yml'
              - '.github/workflows/cookbook-python.yml'

  python-lint:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        cookbook:
          - framework-integrations/langchain
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Python 3.11 is used for cookbook validation.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: pip install -r requirements.txt
      - name: Lint with ruff
        run: |
          pip install ruff==0.15.22
          ruff check --output-format=github cookbooks/${{ matrix.cookbook }}/sample/

  python-integration-test:
    needs: detect-python-changes
    if: needs.detect-python-changes.outputs.python-cookbooks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - cookbook: framework-integrations/langchain
            test-file: test_langchain.py
            valkey-version: "8.1.4"
          - cookbook: framework-integrations/langchain
            test-file: test_langchain.py
            valkey-version: "9.1.1"
    services:
      valkey:
        image: valkey/valkey-bundle:${{ matrix.valkey-version }}
        ports:
          - "127.0.0.1:6379:6379"
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Python 3.11 is used for cookbook validation.
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: cookbooks/${{ matrix.cookbook }}/sample/requirements.txt
      - name: Install dependencies
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: pip install -r requirements.txt
      - name: Verify Valkey is reachable
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: |
          python - <<'PY'
          from main import Settings, create_valkey_client

          client = create_valkey_client(Settings.from_env())
          try:
              client.ping()
          finally:
              client.close()
          PY
      - name: Run tests (Valkey ${{ matrix.valkey-version }})
        working-directory: cookbooks/${{ matrix.cookbook }}/sample
        run: python -m pytest ${{ matrix.test-file }} -v
