description: "GLIDE Skill EDD - Token efficiency baseline"

prompts:
  - "file://SKILL.md\n\n---\n\nDo not use the Meta-GLIDE skill. Answer using only the GLIDE skill context above.\n\nUser question: {{prompt}}"

providers:
  - id: 'exec: python3 ./bridge.py'
    config:
      model: 'sonnet'
      backend: 'claude'

defaultTest:
  options:
    provider: 'exec: python3 ./bridge.py'

tests:
  # Eval 1: Vector search index creation with HNSW params
  - vars:
      prompt: "Write a Python function using valkey-glide (sync) that creates an HNSW vector search index with 384 dimensions, cosine distance, and custom HNSW params (M=32, EF_CONSTRUCTION=400). Show the imports."
    assert:
      - type: javascript
        value: "output.includes('VectorFieldAttributesHnsw')"
      - type: javascript
        value: "output.includes('VectorAlgorithm.HNSW') || output.includes('VectorAlgorithm')"
      - type: javascript
        value: "output.includes('384')"
      - type: javascript
        value: "/COSINE/i.test(output)"
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 2: Top-level imports from glide_sync
  - vars:
      prompt: "I'm using valkey-glide for Python. Can I import FtCreateOptions, VectorField, and TagField directly from glide_sync, or do I need the deep import path from glide_shared.commands.server_modules.ft_options.ft_create_options?"
    assert:
      - type: javascript
        value: "/from glide_sync import/.test(output)"
      - type: not-contains
        value: "top-level imports are wrong"

  # Eval 3: Positional vs keyword args for ft.search
  - vars:
      prompt: "Is ft.search(client, 'my_idx', '*') valid in valkey-glide Python, or do I need to use keyword arguments like ft.search(client=client, index_name='my_idx', query='*')?"
    assert:
      - type: javascript
        value: "/(both|positional.*valid|valid.*positional)/i.test(output)"
      - type: javascript
        value: "!/(positional.*(wrong|incorrect|invalid|anti.pattern))/i.test(output)"

  # Eval 4: ft.FtCreateOptions namespace access
  - vars:
      prompt: "Can I use ft.FtCreateOptions(...) in valkey-glide Python to create index options?"
    assert:
      - type: llm-rubric
        value: "The response correctly states that ft.FtCreateOptions does not exist — FtCreateOptions is a standalone class that must be imported directly (e.g., from glide or glide_sync), not accessed as an attribute of the ft module."

  # Eval 5: Complete vector search example with top-level imports
  - vars:
      prompt: "Write a complete Python example using valkey-glide sync that creates a vector index with HNSW, stores a document, and searches for nearest neighbors. Use top-level imports."
    assert:
      - type: javascript
        value: "/from glide_sync import/.test(output)"
      - type: javascript
        value: "/ft\\.create\\(/.test(output)"
      - type: javascript
        value: "/ft\\.search\\(/.test(output)"
      - type: javascript
        value: "output.includes('VectorFieldAttributesHnsw')"
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 6: Module-level ft functions (not client methods)
  - vars:
      prompt: "Write a Python function using GLIDE that creates a vector search index for product embeddings and then searches for similar products. The index should have a 768-dim embedding field and a text field for product name."
    assert:
      - type: javascript
        value: "/\\bft\\.create\\(/.test(output)"
        metric: uses-module-ft-create
      - type: javascript
        value: "/\\bft\\.search\\(/.test(output)"
        metric: uses-module-ft-search
      - type: javascript
        value: "/from glide(_sync)? import/.test(output)"
        metric: imports-ft-module
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 7: FT.AGGREGATE with module-level function
  - vars:
      prompt: "I have a valkey-glide Python app (async). I need to run an FT.AGGREGATE query that groups products by category and counts them. Show me how."
    assert:
      - type: llm-rubric
        value: "The response uses ft.aggregate or custom_command with FT.AGGREGATE as a module-level function (not a client method), and imports ft from glide. It does not show client.ft_aggregate() or client.ft() as the recommended pattern."
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 8: Drop/create/search with module-level functions
  - vars:
      prompt: "Using valkey-glide Python, write a function that drops an index if it exists, creates a new one with TAG and NUMERIC fields, then does a search with filters. Use the sync client."
    assert:
      - type: javascript
        value: "/\\bft\\.dropindex\\(/.test(output)"
        metric: uses-module-ft-dropindex
      - type: javascript
        value: "/\\bft\\.create\\(/.test(output)"
        metric: uses-module-ft-create
      - type: javascript
        value: "/\\bft\\.search\\(/.test(output)"
        metric: uses-module-ft-search
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 9: Code review - identify client.ft_search as wrong
  - vars:
      prompt: |
        Review this Python code for correctness:
        ```python
        from glide import GlideClusterClient

        async def search(client: GlideClusterClient, query: str):
            return await client.ft_search('my_idx', query)
        ```
    assert:
      - type: javascript
        value: "/(incorrect|wrong|invalid|doesn't exist|does not exist|not.*(method|attribute|valid))/i.test(output)"
        metric: identifies-error
      - type: javascript
        value: "/ft\\.search\\(client/.test(output)"
        metric: suggests-ft-search

  # Eval 10: Code review - identify redis-py pattern as wrong
  - vars:
      prompt: |
        Review this Python code for correctness:
        ```python
        from glide_sync import GlideClient

        def create_index(client: GlideClient):
            client.ft().create('products', {
                'name': {'type': 'TEXT'},
                'price': {'type': 'NUMERIC'},
            })
        ```
    assert:
      - type: javascript
        value: "/(incorrect|wrong|invalid|doesn't exist|does not exist|not.*(method|attribute|valid|correct)|redis.py|redis-py)/i.test(output)"
        metric: identifies-error
      - type: javascript
        value: "/ft\\.create\\(client/.test(output)"
        metric: suggests-ft-create

  # Eval 11: Mixed correct/incorrect code review
  - vars:
      prompt: |
        Is this valkey-glide Python code correct?
        ```python
        from glide import GlideClusterClient, ft

        async def drop_and_recreate(client: GlideClusterClient):
            await client.ft_dropindex('old_idx')
            await ft.create(client, 'new_idx', schema=[...])
        ```
    assert:
      - type: llm-rubric
        value: "The response identifies client.ft_dropindex as wrong (should be ft.dropindex(client, ...)) and acknowledges that ft.create(client, ...) is the correct pattern."

  # Eval 12: Go batch - batch.Del takes []string not single string
  - vars:
      prompt: |
        Review this Go code using valkey-glide. Is there a bug here?
        ```go
        func flushUserCache(ctx context.Context, client *glide.Client, userIDs []string) error {
            batch := pipeline.NewStandaloneBatch(false)
            for _, id := range userIDs {
                batch.Del("user:" + id)
            }
            _, err := client.Exec(ctx, *batch, true)
            return err
        }
        ```
    assert:
      - type: llm-rubric
        value: "The response correctly identifies that batch.Del takes []string (a slice of strings), not a single string argument. The code as written will not compile because it passes a single string to Del instead of a []string slice."

  # Eval 13: Go type system prevents StandaloneBatch with ClusterClient
  - vars:
      prompt: "What happens if I accidentally use pipeline.NewStandaloneBatch with a ClusterClient in valkey-glide Go? Will it panic at runtime?"
    assert:
      - type: javascript
        value: "/(compile.*(time|error)|won't compile|will not compile|type.*(mismatch|error|system)|does not compile|compilation.*(error|fail))/i.test(output)"
        metric: says-compile-time
      - type: javascript
        value: "!/will (likely )?result in a runtime error/i.test(output)"
        metric: no-runtime-panic-claim

  # Eval 14: Go batch with raiseOnError=false for per-command error logging
  - vars:
      prompt: "Write a Go function using valkey-glide that executes a batch of SET commands and logs which specific commands failed without stopping on the first error."
    assert:
      - type: javascript
        value: "/Exec(WithOptions)?\\(ctx,.*false/.test(output)"
        metric: uses-raise-on-error-false
      - type: javascript
        value: "/(RequestError|requestError|request_error)/.test(output)"
        metric: checks-request-error
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 15: Client lifecycle - proper cleanup
  - vars:
      prompt: "Write a Python async function that connects to Valkey using GLIDE and performs a SET operation. Show proper resource cleanup."
    assert:
      - type: llm-rubric
        value: "The response demonstrates automatic resource cleanup using async with (context manager) or try/finally with explicit close(). It must not leave the client unclosed."
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.4"
        metric: code-density

  # Eval 16: Client lifecycle - singleton pattern
  - vars:
      prompt: |
        Review this Python FastAPI code:
        ```python
        @app.get("/users/{user_id}")
        async def get_user(user_id: str):
            config = GlideClientConfiguration([NodeAddress("localhost", 6379)])
            client = await GlideClient.create(config)
            result = await client.get(f"user:{user_id}")
            await client.close()
            return {"data": result}
        ```
    assert:
      - type: llm-rubric
        value: "The response identifies creating a new client per request as an anti-pattern and recommends creating a single client at startup, reused across all requests."

  # Eval 17: Client lifecycle - reconnection
  - vars:
      prompt: "In valkey-glide Python, if I get a RequestException should I close the client and create a new one?"
    assert:
      - type: llm-rubric
        value: "The response says no — GLIDE auto-reconnects on transient errors like RequestException and TimeoutError. Only recreate on ClosingError, which means the client was explicitly closed."

  # Eval 18: Batch - CROSSSLOT in cluster
  - vars:
      prompt: "I'm using GlideClusterClient with Batch(True). Can I batch SET commands for keys 'user:1' and 'product:5' together?"
    assert:
      - type: llm-rubric
        value: "The response warns that atomic batches require all keys to map to the same hash slot. 'user:1' and 'product:5' are different slots, causing CROSSSLOT. Suggests hash tags or non-atomic batch."

  # Eval 19: Batch - raise_on_error semantics
  - vars:
      prompt: "What's the difference between raise_on_error=True and raise_on_error=False when calling client.exec() in valkey-glide Python?"
    assert:
      - type: llm-rubric
        value: "The response explains: True raises an exception on the first error encountered; False returns errors embedded in the results array at their corresponding positions, allowing inspection of which commands failed."

  # Eval 20: Timeout configuration
  - vars:
      prompt: "How do I set request timeouts in valkey-glide Python? What happens if I don't set one?"
    assert:
      - type: javascript
        value: "/250/i.test(output)"
        metric: mentions-default-250ms
      - type: javascript
        value: "/TimeoutError/i.test(output)"
        metric: mentions-timeout-error-type

  # Eval 21: Error handling - specific exceptions
  - vars:
      prompt: |
        Review this valkey-glide Python error handling:
        ```python
        try:
            await client.set("key", "value")
        except Exception as e:
            logger.error(f"Failed: {e}")
        ```
    assert:
      - type: llm-rubric
        value: "The response identifies catching bare Exception as an anti-pattern and recommends catching specific GLIDE exceptions (TimeoutError, RequestError, ConnectionError, or ClosingError) instead."

  # Eval 22: Cluster - hash tags
  - vars:
      prompt: "I need to atomically increment a counter and add to a related list in valkey-glide cluster mode. The keys are 'counter:orders' and 'list:recent_orders'. How do I avoid CROSSSLOT errors?"
    assert:
      - type: javascript
        value: "/\\{[^}]+\\}/.test(output)"
        metric: shows-hash-tag-syntax
      - type: javascript
        value: "/(same slot|same hash slot|co-locat|slot assignment)/i.test(output)"
        metric: explains-slot-colocation

  # Eval 23: Performance - sequential anti-pattern
  - vars:
      prompt: |
        Review this valkey-glide Python code for performance:
        ```python
        async def get_user_profiles(client, user_ids):
            profiles = []
            for uid in user_ids:
                profile = await client.hgetall(f"user:{uid}")
                profiles.append(profile)
            return profiles
        ```
    assert:
      - type: llm-rubric
        value: "The response identifies sequential awaits in a loop as a performance anti-pattern causing one round-trip per iteration, and recommends batching (pipeline), asyncio.gather for concurrency, or MGET-style bulk operations."

  # Eval 24: Package selection
  - vars:
      prompt: "I'm building a Python app with Valkey. Should I use the 'redis' package or 'valkey' package from PyPI?"
    assert:
      - type: llm-rubric
        value: "The response recommends valkey-glide (not redis, not the valkey PyPI package) as the official client, and steers away from Redis forks."

  # ============================================================
  # GAP 1: Python Performance (target: python-performance.md)
  # ============================================================

  # Eval 25: AZ Affinity configuration
  - vars:
      prompt: "I'm deploying a read-heavy Python app with valkey-glide on AWS ElastiCache. Over 90% of operations are reads. How do I configure the client to prefer reading from replicas in the same availability zone?"
    assert:
      - type: javascript
        value: "/AZ_AFFINITY|az_affinity/i.test(output)"
        metric: mentions-az-affinity
      - type: javascript
        value: "/client_az|clientAZ/i.test(output)"
        metric: mentions-client-az
      - type: javascript
        value: "/ReadFrom/i.test(output)"
        metric: mentions-read-from

  # Eval 26: Serverless / Lambda lazy_connect
  - vars:
      prompt: "I'm writing a Python Lambda function that uses valkey-glide. Cold starts are killing me because the client connects immediately. How do I defer the connection until the first command is sent?"
    assert:
      - type: javascript
        value: "/lazy_connect.*True|lazy_connect=True/i.test(output)"
        metric: uses-lazy-connect
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.3"
        metric: code-density

  # Eval 27: Concurrent operations with asyncio.gather
  - vars:
      prompt: "I need to fetch a user profile, their recent posts, and their notifications from Valkey concurrently in my Python async app using valkey-glide. Show me how."
    assert:
      - type: javascript
        value: "/asyncio\\.gather/i.test(output)"
        metric: uses-asyncio-gather
      - type: javascript
        value: "const codeBlocks = output.match(/```[\\s\\S]*?```/g) || []; const codeLen = codeBlocks.join('').length; codeLen / output.length > 0.3"
        metric: code-density

  # Eval 28: Throughput tuning - inflight_requests_limit
  - vars:
      prompt: "My valkey-glide Python app is hitting throughput limits under high concurrency. How do I increase the number of in-flight requests allowed?"
    assert:
      - type: javascript
        value: "/inflight_requests_limit/i.test(output)"
        metric: mentions-inflight-limit
      - type: javascript
        value: "/1000|2000/i.test(output)"
        metric: mentions-default-or-increased

  # Eval 29: OpenTelemetry monitoring setup
  - vars:
      prompt: "How do I enable OpenTelemetry tracing and metrics for my valkey-glide Python client? I want 1% trace sampling in production."
    assert:
      - type: javascript
        value: "/OpenTelemetry\\.init|OpenTelemetryConfig/i.test(output)"
        metric: uses-otel-init
      - type: javascript
        value: "/sample_percentage|samplePercentage/i.test(output)"
        metric: mentions-sampling

  # ============================================================
  # GAP 2: Java Vector Search (target: java-vector-search.md)
  # ============================================================

  # Eval 30: Java FT imports and index creation
  - vars:
      prompt: "Write Java code using valkey-glide that creates a vector search index with a 768-dim COSINE embedding field. Show the imports."
    assert:
      - type: javascript
        value: "/import glide\\.api\\.commands\\.servermodules\\.FT/i.test(output)"
        metric: correct-ft-import
      - type: javascript
        value: "/FT\\.create\\(client/i.test(output)"
        metric: uses-static-ft-create
      - type: javascript
        value: "/VectorFieldFlat|VectorFieldHnsw|DistanceMetric\\.COSINE/i.test(output)"
        metric: uses-vector-field-builder

  # Eval 31: Java vector encoding with GlideString
  - vars:
      prompt: "In valkey-glide Java, how do I store a float[] embedding vector in a hash field? I tried using String but the search returns no results."
    assert:
      - type: javascript
        value: "/GlideString\\.of/i.test(output)"
        metric: uses-glide-string
      - type: javascript
        value: "/ByteBuffer|LITTLE_ENDIAN|ByteOrder/i.test(output)"
        metric: mentions-byte-encoding
      - type: llm-rubric
        value: "The response explains that String corrupts binary vector data and you must use GlideString.of(byte[]) with little-endian float encoding."

  # Eval 32: Java vector search query execution
  - vars:
      prompt: "Write a Java function using valkey-glide that performs a KNN vector similarity search on an index called 'products_idx', finding the 5 nearest neighbors to a query vector. Show how to parse the results."
    assert:
      - type: javascript
        value: "/FT\\.search\\(client/i.test(output)"
        metric: uses-static-ft-search
      - type: javascript
        value: "/FTSearchOptions/i.test(output)"
        metric: uses-search-options
      - type: javascript
        value: "/results\\[0\\]|\\(Long\\)/i.test(output)"
        metric: parses-count-from-results

  # Eval 33: Java FT - code review of client method pattern
  - vars:
      prompt: |
        Review this Java valkey-glide code:
        ```java
        import glide.api.GlideClient;

        public void createIndex(GlideClient client) throws Exception {
            client.ftCreate("my_idx", schema).get();
        }
        ```
    assert:
      - type: javascript
        value: "/(incorrect|wrong|invalid|doesn't exist|does not exist|not.*(method|valid))/i.test(output)"
        metric: identifies-error
      - type: javascript
        value: "/FT\\.create\\(client/i.test(output)"
        metric: suggests-static-ft-create

  # ============================================================
  # GAP 2b: Java Performance (target: java-performance.md)
  # ============================================================

  # Eval 34: Java client lifecycle - Spring Bean
  - vars:
      prompt: "How do I configure a valkey-glide GlideClient as a Spring Boot bean with proper cleanup?"
    assert:
      - type: javascript
        value: "/@Bean/i.test(output)"
        metric: uses-bean-annotation
      - type: javascript
        value: "/destroyMethod.*close|close/i.test(output)"
        metric: mentions-close-cleanup

  # Eval 35: Java thread safety - Batch not shared
  - vars:
      prompt: "Is the valkey-glide Java GlideClient thread-safe? Can I share Batch objects across threads?"
    assert:
      - type: llm-rubric
        value: "The response says the client IS thread-safe and can be shared across threads, but Batch objects are NOT thread-safe and must be created per-thread or per-operation."

  # Eval 36: Java CompletableFuture exception unwrapping
  - vars:
      prompt: |
        Review this Java valkey-glide error handling:
        ```java
        try {
            client.get("key").get();
        } catch (ExecutionException e) {
            logger.error("Failed: " + e.getMessage());
        }
        ```
    assert:
      - type: llm-rubric
        value: "The response identifies that ExecutionException wraps the real exception and you must call e.getCause() to get the actual GLIDE exception (TimeoutException, RequestException, etc.)."

  # Eval 37: Java retry strategy with BackoffStrategy
  - vars:
      prompt: "How do I configure exponential backoff reconnection in valkey-glide Java?"
    assert:
      - type: javascript
        value: "/BackoffStrategy/i.test(output)"
        metric: uses-backoff-strategy
      - type: javascript
        value: "/reconnectStrategy|reconnect_strategy/i.test(output)"
        metric: sets-reconnect-strategy

  # ============================================================
  # GAP 3: Routing Accuracy
  # ============================================================

  # Eval 38: Language detection - Java vs Python
  - vars:
      prompt: "Write a Java function using valkey-glide that connects to a cluster and performs a SET operation with proper error handling."
    assert:
      - type: javascript
        value: "/import glide\\.api/i.test(output)"
        metric: uses-java-imports
      - type: javascript
        value: "/CompletableFuture|ExecutionException|\\.get\\(\\)/i.test(output)"
        metric: uses-java-async-pattern
      - type: javascript
        value: "!/(await|async def|import glide$|from glide)/i.test(output)"
        metric: no-python-code

  # Eval 39: FT trigger routes to vector search content
  - vars:
      prompt: "I need to build a semantic search feature in my Java app using valkey-glide. How do I create a vector index and query it?"
    assert:
      - type: javascript
        value: "/import glide\\.api\\.commands\\.servermodules\\.FT|FT\\.create/i.test(output)"
        metric: routes-to-java-ft
      - type: javascript
        value: "/DistanceMetric|VectorField/i.test(output)"
        metric: has-vector-specific-content
      - type: javascript
        value: "!/(from glide|import glide$|ft\\.create\\(client)/i.test(output)"
        metric: not-python-ft

  # Eval 40: Performance trigger routes to performance content
  - vars:
      prompt: "How do I optimize my valkey-glide Python client for a serverless deployment on AWS Lambda with high read throughput?"
    assert:
      - type: javascript
        value: "/lazy_connect|lazyConnect/i.test(output)"
        metric: mentions-lazy-connect
      - type: javascript
        value: "/inflight_requests_limit|AZ_AFFINITY|az_affinity/i.test(output)"
        metric: mentions-perf-config

  # ============================================================
  # GAP 4: python-ft-api.md specifics
  # ============================================================

  # Eval 41: FtSearchOptions with FtSearchLimit (pagination)
  - vars:
      prompt: "How do I paginate FT.SEARCH results in valkey-glide Python? I want to get results 10-20."
    assert:
      - type: javascript
        value: "/FtSearchLimit/i.test(output)"
        metric: uses-ft-search-limit
      - type: javascript
        value: "/offset.*count|FtSearchLimit\\(/i.test(output)"
        metric: correct-limit-params
      - type: javascript
        value: "!/(first_result.*limit.*10|FtSearchOptions\\(.*limit=10)/i.test(output)"
        metric: no-wrong-pagination

  # Eval 42: FT.AGGREGATE response format
  - vars:
      prompt: "What format does ft.aggregate return in valkey-glide Python? Is it [count, row1, row2, ...] like valkey-py?"
    assert:
      - type: llm-rubric
        value: "The response explains that GLIDE returns List[dict] (a flat list of dictionaries), NOT the [count, row1, row2, ...] format used by valkey-py/redis-py. Each dict represents one row with field names as keys."

  # Eval 43: FT.AGGREGATE LOAD requirement
  - vars:
      prompt: "I'm using ft.aggregate in valkey-glide Python with a SUM reducer on the 'price' field but it always returns 0. What am I doing wrong?"
    assert:
      - type: llm-rubric
        value: "The response identifies the missing LOAD clause as the issue. FT.AGGREGATE reducers like SUM, AVG, MIN, MAX require explicit loadFields=['@price'] in the FtAggregateOptions. Without LOAD, the field data is not available to the reducer and it silently returns 0. COUNT is the exception that doesn't need LOAD."
