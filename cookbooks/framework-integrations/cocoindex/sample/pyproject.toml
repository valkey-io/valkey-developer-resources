[project]
name = "cocoindex-valkey-rag"
version = "0.1.0"
description = "CocoIndex RAG pipeline with Valkey vector store"
requires-python = ">=3.11"
dependencies = [
    "cocoindex[valkey,sentence_transformers]==1.0.16",
    "valkey-glide==2.5.0",
    "sentence-transformers==5.6.0",
    "numpy==2.2.6",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.setuptools]
packages = []
