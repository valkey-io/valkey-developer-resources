[project]
name = "dify-valkey-cookbook"
version = "1.0.0"
description = "Sample tests for Dify + Valkey vector store cookbook"
requires-python = ">=3.11"
dependencies = [
    "valkey-glide>=1.3.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
