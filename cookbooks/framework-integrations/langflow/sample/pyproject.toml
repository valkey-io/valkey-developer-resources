[project]
name = "langflow-valkey-cookbook"
version = "0.1.0"
description = "Sample scripts for the Langflow + Valkey cookbook"
requires-python = ">=3.10"
dependencies = [
    "requests==2.32.5",
    "valkey==6.1.1",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]
langflow = [
    "langflow==1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
markers = [
    "integration: marks tests that require running Valkey and Langflow (deselect with '-m \"not integration\"')",
]
