services:
  valkey:
    image: valkey/valkey-bundle:9.1.0
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  langflow:
    image: langflowai/langflow:1.11.0
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      # WARNING: Disables authentication — for local development only.
      # Do NOT use in production or on a publicly accessible host.
      - LANGFLOW_AUTO_LOGIN=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      valkey:
        condition: service_healthy
