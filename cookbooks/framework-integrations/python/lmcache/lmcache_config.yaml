# LMCache engine config, mounted into both vLLM replicas.
#
# This is the one line that points LMCache at Valkey as its KV-cache store.
# Everything else here is a sensible default. Both vLLM replicas load this
# same file (via LMCACHE_CONFIG_FILE) and therefore share one Valkey cache.
remote_url: "valkey://valkey:6379"

# 256 tokens per KV chunk (LMCache's default). Chunking is what lets a later
# request reuse the KV of a shared prefix without recomputing it.
chunk_size: 256

# "naive" runs anywhere. LMCache also offers "cachegen" (compressed), but its
# encoder needs a GPU at runtime, so keep "naive" for this CPU walkthrough.
remote_serde: "naive"
