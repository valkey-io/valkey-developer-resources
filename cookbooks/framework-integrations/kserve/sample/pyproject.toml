[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kserve-valkey-cookbook"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "valkey==6.1.1",
    "numpy==1.26.4",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-timeout==2.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
timeout = 30
