<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">llm-d serving with Valkey: architecture</title>
<desc id="desc">Chat requests go through Envoy, which asks the EPP which vLLM replica to use. The replicas publish KV events to the EPP and share KV through the LMCache server. One Valkey server holds the router&#x27;s prefix-cache index (db 1), LMCache&#x27;s KV chunks (db 0) and the batch queue and quotas (db 0) used by llm-d-async.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
</defs>
<rect width="920" height="640" fill="#ffffff"/>
<rect x="40" y="24" width="160" height="44" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="120.0" y="51.2" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">Chat client</text>
<rect x="40" y="120" width="160" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="120.0" y="141.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">Envoy</text>
<text x="120.0" y="161.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">localhost:8080</text>
<rect x="340" y="120" width="180" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="430.0" y="141.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">EPP</text>
<text x="430.0" y="161.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">(Endpoint Picker)</text>
<path d="M 120 68 L 120 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="69.2" y="83.5" width="101.6" height="20.9" fill="#ffffff"/>
<text x="120" y="98.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">chat request</text>
<path d="M 200 146 L 340 146" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="234.8" y="135.6" width="70.4" height="20.9" fill="#ffffff"/>
<text x="270" y="150.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">ext_proc</text>
<rect x="30" y="222" width="300" height="76" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="40" y="314" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">vLLM replicas</text>
<rect x="48" y="246" width="120" height="40" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="108.0" y="271.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">vllm-a</text>
<rect x="192" y="246" width="120" height="40" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="252.0" y="271.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">vllm-b</text>
<path d="M 105 172 L 105 246" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 160 172 L 160 200 L 252 200 L 252 246" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 330 262 L 450 262 L 450 172" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="327.5" y="251.6" width="125.0" height="20.9" fill="#ffffff"/>
<text x="390" y="266.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">KV events (ZMQ)</text>
<rect x="100" y="336" width="160" height="44" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="180.0" y="363.2" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">LMCache server</text>
<path d="M 180 298 L 180 336" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="580" y="300" width="160" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="660.0" y="321.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">llm-d-async</text>
<text x="660.0" y="341.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">(batch processor)</text>
<rect x="758" y="300" width="150" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="833.0" y="322.1" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Python submitter</text>
<text x="833.0" y="339.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">(batch jobs)</text>
<path d="M 660 300 L 660 96 L 170 96 L 170 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="403.9" y="85.5" width="312.2" height="20.9" fill="#ffffff"/>
<text x="560" y="100.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">admitted batch jobs (same path as chat)</text>
<rect x="30" y="430" width="860" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<rect x="45" y="470" width="270" height="70" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="180.0" y="500.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">db 0: KV chunks</text>
<text x="180.0" y="520.0" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">LMCache, 256 tokens each</text>
<rect x="330" y="470" width="210" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="435.0" y="500.8" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">db 1: prefix-cache index</text>
<text x="435.0" y="519.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0f172a">engine:&lt;hash&gt;, &lt;hash&gt;</text>
<rect x="560" y="470" width="315" height="70" rx="6" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="717.5" y="500.8" font-size="14" text-anchor="middle" font-weight="bold" fill="#0f172a">db 0: batch queue and quotas</text>
<text x="717.5" y="519.0" font-size="14" text-anchor="middle" font-weight="normal" fill="#0f172a">request-sortedset, quota:*, result-list</text>
<path d="M 180 380 L 180 470" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="117.5" y="397.6" width="125.0" height="20.9" fill="#ffffff"/>
<text x="180" y="412.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">store / load KV</text>
<path d="M 500 172 L 500 470" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="445.3" y="389.6" width="109.4" height="20.9" fill="#ffffff"/>
<text x="500" y="404.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">block lookups</text>
<path d="M 660 352 L 660 470" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="566.3" y="379.1" width="187.4" height="37.8" fill="#ffffff"/>
<text x="660" y="394.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">pull jobs, check quota,</text>
<text x="660" y="411.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">push results</text>
<path d="M 833 352 L 833 470" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="813.4" y="389.6" width="39.2" height="20.9" fill="#ffffff"/>
<text x="833" y="404.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">ZADD</text>
<text x="30" y="595" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">Valkey roles:</text>
<rect x="128" y="584" width="18" height="14" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="152" y="595" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">prefix-cache index (db 1)</text>
<rect x="340" y="584" width="18" height="14" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="364" y="595" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">KV cache (db 0)</text>
<rect x="490" y="584" width="18" height="14" rx="2" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="514" y="595" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">batch queue and quotas (db 0)</text>
<rect x="40" y="438" width="240" height="20" fill="#ffffff"/>
<text x="46" y="452" font-size="15" text-anchor="start" font-weight="bold" fill="#0f172a">Valkey server (valkey:6379)</text>
</svg>
