<svg xmlns="http://www.w3.org/2000/svg" width="920" height="670" viewBox="0 0 920 670" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">GPU benchmark: the same stack on four GPUs</title>
<desc id="desc">inference-perf sends requests to Envoy on port 8081, which asks the EPP which of four vLLM replicas to use. Each replica runs on its own NVIDIA L40S GPU and publishes KV events to the EPP. The replicas share KV with the LMCache server through CUDA IPC; the server keeps a 64 GB L1 in host memory and stores every chunk in Valkey database 0. With the precise-valkey configuration the EPP keeps its prefix-cache index in Valkey database 1.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
</defs>
<rect width="920" height="670" fill="#ffffff"/>
<rect x="40" y="24" width="180" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="130" y="45.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">inference-perf</text>
<text x="130" y="65" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">(load generator)</text>
<rect x="40" y="120" width="180" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="130" y="141.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">Envoy</text>
<text x="130" y="161" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">:8081</text>
<rect x="620" y="120" width="220" height="52" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="730" y="141.5" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">EPP</text>
<text x="730" y="161" font-size="15" text-anchor="middle" font-weight="normal" fill="#0f172a">(Endpoint Picker v1.0.0)</text>
<path d="M 130 76 L 130 120" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="138" y="87.5" width="84" height="20.9" fill="#ffffff"/>
<text x="142" y="102.5" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">requests</text>
<path d="M 220 146 L 620 146" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="385" y="135.6" width="70" height="20.9" fill="#ffffff"/>
<text x="420" y="150.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">ext_proc</text>
<rect x="30" y="222" width="560" height="80" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="40" y="318" font-size="12" text-anchor="start" font-weight="normal" fill="#475569">4 vLLM replicas, one NVIDIA L40S GPU each</text>
<rect x="48" y="240" width="120" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="108" y="260" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">vllm-0</text>
<text x="108" y="279" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">GPU 0</text>
<rect x="188" y="240" width="120" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="248" y="260" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">vllm-1</text>
<text x="248" y="279" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">GPU 1</text>
<rect x="328" y="240" width="120" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="388" y="260" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">vllm-2</text>
<text x="388" y="279" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">GPU 2</text>
<rect x="468" y="240" width="120" height="48" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="528" y="260" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">vllm-3</text>
<text x="528" y="279" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">GPU 3</text>
<path d="M 130 172 L 130 200" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M 108 200 L 528 200" fill="none" stroke="#475569" stroke-width="1.5"/>
<path d="M 108 200 L 108 240" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 248 200 L 248 240" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 388 200 L 388 240" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 528 200 L 528 240" fill="none" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M 590 262 L 680 262 L 680 172" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<rect x="617.5" y="200.6" width="125" height="20.9" fill="#ffffff"/>
<text x="680" y="215.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">KV events (ZMQ)</text>
<rect x="150" y="350" width="360" height="64" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
<text x="330" y="376" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">LMCache server</text>
<text x="330" y="397" font-size="14" text-anchor="middle" font-weight="normal" fill="#0f172a">L1: 64 GB host memory (LRU)</text>
<path d="M 330 302 L 330 350" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="338" y="315.6" width="112" height="20.9" fill="#ffffff"/>
<text x="342" y="330.6" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">KV (CUDA IPC)</text>
<rect x="30" y="460" width="860" height="130" rx="8" fill="#ffffff" stroke="#475569" stroke-width="2"/>
<rect x="40" y="468" width="250" height="20" fill="#ffffff"/>
<text x="46" y="482" font-size="15" text-anchor="start" font-weight="bold" fill="#0f172a">Valkey server, 8 I/O threads</text>
<rect x="45" y="500" width="400" height="74" rx="6" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="245" y="528" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">db 0: KV chunks</text>
<text x="245" y="550" font-size="14" text-anchor="middle" font-weight="normal" fill="#0f172a">256 tokens (36 MiB) each, about 150 GiB per run</text>
<rect x="470" y="500" width="405" height="74" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="672.5" y="528" font-size="15" text-anchor="middle" font-weight="bold" fill="#0f172a">db 1: prefix-cache index</text>
<text x="672.5" y="550" font-size="14" text-anchor="middle" font-weight="normal" fill="#0f172a">precise-valkey configuration only</text>
<path d="M 330 414 L 330 500" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="338" y="426.6" width="196" height="20.9" fill="#ffffff"/>
<text x="342" y="441.6" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">store KV; load on L1 miss</text>
<path d="M 790 172 L 790 500" fill="none" stroke="#475569" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<rect x="735.3" y="389.6" width="109.4" height="20.9" fill="#ffffff"/>
<text x="790" y="404.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#0f172a">block lookups</text>
<text x="30" y="622" font-size="13" text-anchor="start" font-weight="bold" fill="#0f172a">Valkey roles:</text>
<rect x="128" y="611" width="18" height="14" rx="2" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
<text x="152" y="622" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">prefix-cache index (db 1)</text>
<rect x="340" y="611" width="18" height="14" rx="2" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="364" y="622" font-size="13" text-anchor="start" font-weight="normal" fill="#0f172a">KV cache (db 0)</text>
<text x="30" y="652" font-size="13" text-anchor="start" font-weight="normal" fill="#475569">Only the router config changes between configurations; random-no-lmcache also runs the replicas without LMCache.</text>
</svg>
