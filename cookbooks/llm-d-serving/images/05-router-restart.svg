<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600" viewBox="0 0 920 600" role="img" aria-labelledby="title desc" font-family="Arial, Helvetica, sans-serif">
<title id="title">The index outlives a router restart</title>
<desc id="desc">Two lanes with the same events: conversations are warmed, more traffic follows, then the router restarts and a follow-up arrives. With the index in router memory the restart empties it, and it is rebuilt only from each replica&#x27;s replay buffer of the last 32 KV-event batches, which no longer covers the warm conversations; the follow-up is no_match and is placed by load alone, on either server; if it lands on the other one, that server reloads the prefix from Valkey. With the index in Valkey db 1 the restarted router reads the index back, and the follow-up is sticky and a local hit.</desc>
