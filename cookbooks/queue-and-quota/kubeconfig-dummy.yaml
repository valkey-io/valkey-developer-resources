# Dummy kubeconfig so llm-d-async's metrics server can start off-cluster.
# The async processor calls controller-runtime's GetConfigOrDie() unconditionally
# at startup; off a Kubernetes cluster that call fails unless SOME kubeconfig is
# present. This one points at an unreachable API server (127.0.0.1:1). With the
# metrics endpoint's auth disabled (--metrics-endpoint-auth=false), the processor
# never actually contacts this API — the config only needs to parse.
apiVersion: v1
kind: Config
clusters:
- cluster: {server: "https://127.0.0.1:1"}
  name: dummy
contexts:
- context: {cluster: dummy, user: dummy}
  name: dummy
current-context: dummy
users:
- name: dummy
  user: {token: "dummy"}
