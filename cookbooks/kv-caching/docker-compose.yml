# KV Caching with Valkey — the full stack the notebook drives.
#
#   valkey          one shared KV-cache store (LMCache's L2 backend)
#   lmcache-server  standalone LMCache server: L1 in its own memory, L2 -> Valkey
#   vllm-a          vLLM replica A, KV connector pointed at the LMCache server
#   vllm-b          vLLM replica B, same connector, same LMCache server
#
# How a KV chunk flows on CPU:
#
#   vLLM (prefill)  ->  LMCacheMPConnector  ->  lmcache-server (L1)  ->  Valkey (L2)
#
# The CPU build has no in-worker KV connector, so both replicas hand their KV
# to the standalone `lmcache server` via the multi-process connector. The
# server writes through to Valkey (its L2 backend), which is what makes one
# replica's KV visible to the other.
#
# Resource note: each vLLM replica needs roughly 4–5 GiB of RAM. Give your
# container runtime at least 16 GiB so both replicas, the LMCache server, and
# Valkey fit. On a smaller machine, start one replica and skip the two-replica
# step. The batching and cache-size flags below are capped low because the
# notebook only sends one request at a time; the defaults over-provision for
# concurrency this demo never uses.
#
# LMCache is not bundled in the vLLM CPU image, so every service that needs it
# pip-installs it on startup, pinned to one version in both places it appears
# (the x-vllm-common anchor and the lmcache-server service). The client and
# server halves talk over the MP connector and must run the same version, so
# keep the two pins identical. The server also needs the *sync* glide client
# for its Valkey L2 adapter; the async valkey-glide is not sufficient.
#
# The vLLM image is pinned by digest, not just the mutable v0.28.0 tag, because
# this exact image ships torch as a CPU build. LMCache depends on torch without
# a version pin, so on an image without CPU torch already present the install
# would pull the CUDA build. The digest guarantees the CPU-torch image.
x-lmcache-env: &lmcache-env
  # Required by LMCache to enable the v1 code paths.
  LMCACHE_USE_EXPERIMENTAL: "True"

x-vllm-common: &vllm-common
  image: vllm/vllm-openai-cpu:v0.28.0@sha256:197354e6475e638eb5ccca09beb078488046a82de0e204e7429bf1a804df9647
  entrypoint: ["/bin/bash", "-c"]
  command:
    - |
      pip install --quiet lmcache==0.5.4
      # Qwen2.5-0.5B-Instruct is small, ungated, and ships its own chat
      # template, so vLLM can serve /v1/chat/completions directly. The
      # notebook's multi-turn conversation renders to a deterministic token
      # prefix, which is what LMCache keys its KV chunks on.
      #
      # lmcache.mp.mq_timeout bounds the worker<->server registration/transfer
      # calls. Registration takes about a second here; 120s is headroom for a
      # slow or emulated host. If it trips, suspect the server's transfer-mode
      # wiring (see --supported-transfer-mode), not a too-short timeout.
      #
      # --dtype float16 avoids vLLM's default bf16-on-CPU. On an emulated
      # aarch64 host the virtual CPU may not advertise bf16 support, and the
      # oneDNN BLAS fallback then crashes on the first real prefill (SIGILL,
      # worker exit -4). float16 sidesteps that path at the same 2-byte
      # footprint as bf16; float32 would roughly double per-replica memory.
      exec python3 -m vllm.entrypoints.openai.api_server \
        --model Qwen/Qwen2.5-0.5B-Instruct \
        --dtype float16 \
        --max-model-len 2048 \
        --enforce-eager \
        --max-num-seqs 4 \
        --max-num-batched-tokens 2048 \
        --kv-transfer-config '{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.host":"tcp://lmcache-server","lmcache.mp.port":5555,"lmcache.mp.mq_timeout":120.0}}'
  environment:
    # Shared with lmcache-server via the *lmcache-env anchor.
    <<: *lmcache-env
    # CPU KV-cache pool size in GiB. Must be an integer (vLLM rejects
    # fractional values); 1 is the practical floor, kept small so the whole
    # stack fits a 16 GiB runtime.
    VLLM_CPU_KVCACHE_SPACE: "1"
    # Qwen2.5-0.5B-Instruct is ungated; no HF token needed. Silence the rate-limit warning.
    HF_HUB_DISABLE_PROGRESS_BARS: "1"
  volumes:
    - hf-cache:/root/.cache/huggingface
  # vLLM's multiprocess executor needs more than Docker's default 64 MiB of
  # shared memory, or the engine core aborts on startup.
  shm_size: "2gb"
  depends_on:
    lmcache-server:
      condition: service_healthy
  healthcheck:
    # Ready when the OpenAI-compatible server answers /health.
    test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
    interval: 10s
    timeout: 5s
    retries: 60
    # Grace for first startup: pip install + model load + KV registration is
    # about 40s here; 180s leaves margin for a slower or emulated host.
    start_period: 180s

services:
  valkey:
    container_name: valkey
    image: valkey/valkey-bundle:9.1.2
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The standalone LMCache server owns KV storage. Its L1 tier lives in this
  # container's memory; its L2 tier is Valkey, wired via the built-in "valkey"
  # L2 adapter. Both vLLM replicas connect to it over ZMQ on port 5555.
  lmcache-server:
    container_name: lmcache-server
    image: vllm/vllm-openai-cpu:v0.28.0@sha256:197354e6475e638eb5ccca09beb078488046a82de0e204e7429bf1a804df9647
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        # The Valkey L2 adapter needs the *sync* glide client specifically.
        pip install --quiet lmcache==0.5.4 valkey-glide-sync==2.5.2
        # --supported-transfer-mode auto loads BOTH worker->server transfer
        # paths. CPU vLLM workers use the "engine_driven" (PREPARE/COMMIT) path;
        # the server default (lmcache_driven) loads only the GPU/server-driven
        # handlers, so a CPU worker's register request finds no handler and the
        # connector hangs. "auto" lets either device type connect.
        exec lmcache server \
          --host 0.0.0.0 --port 5555 \
          --l1-size-gb 0.5 \
          --eviction-policy noop \
          --l2-store-policy skip_l1 \
          --supported-transfer-mode auto \
          --l2-adapter '{"type":"valkey","startup_nodes":"valkey:6379"}'
    environment:
      # Shared with the vLLM replicas via the *lmcache-env anchor.
      <<: *lmcache-env
    depends_on:
      valkey:
        condition: service_healthy
    healthcheck:
      # Ready when the ZMQ cache server is accepting connections on 5555.
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('localhost',5555))\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  vllm-a:
    <<: *vllm-common
    container_name: vllm-a
    ports:
      - "127.0.0.1:8001:8000"

  # vllm-b waits on vllm-a being healthy (not just lmcache-server) so the two
  # replicas load their weights sequentially. Model load spikes memory above
  # steady state; staggering keeps the two spikes from stacking and exceeding a
  # memory-constrained runtime, even though both fit comfortably once running.
  vllm-b:
    <<: *vllm-common
    container_name: vllm-b
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      lmcache-server:
        condition: service_healthy
      vllm-a:
        condition: service_healthy

volumes:
  # Cache model weights across restarts so replicas don't each re-download.
  hf-cache:
