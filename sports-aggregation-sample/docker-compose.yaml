# docker-compose.yml
services:
  valkey:
    image: valkey/valkey-bundle:9.1
    command: ["valkey-server", "--protected-mode", "no"]
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  feeder:
    build:
      context: app
      dockerfile: Dockerfile
      target: feeder
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
      NUM_GAMES: 8
      TICK_INTERVAL_MS: 2000
    depends_on:
      valkey:
        condition: service_healthy

  webapp:
    build:
      context: app
      dockerfile: Dockerfile
      target: webapp
    environment:
      VALKEY_HOST: valkey
      VALKEY_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      valkey:
        condition: service_healthy

volumes:
  valkey-data:
