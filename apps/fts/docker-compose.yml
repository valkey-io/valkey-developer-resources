services:
  valkey:
    build:
      context: ./docker
      dockerfile: Dockerfile
      args:
        BUILD_JOBS: 4
    container_name: flicenjoyer-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - flicenjoyer
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  flicenjoyer:
    driver: bridge
