services:
  valkey:
    image: valkey/valkey-bundle:unstable
    container_name: flicenjoyer-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      flicenjoyer:
        ipv4_address: 172.22.0.2
    healthcheck:
      test: ["CMD", "valkey-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:17
    container_name: flicenjoyer-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: flicenjoyer
      POSTGRES_USER: flicenjoyer
      POSTGRES_PASSWORD: flicenjoyer
    command:
      - "postgres"
      - "-c" 
      - "shared_buffers=128kB"
      - "-c"
      - "effective_cache_size=1MB"
      - "-c"
      - "work_mem=64kB"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "fsync=on"
      - "-c"
      - "full_page_writes=on"
    networks:
      flicenjoyer:
        ipv4_address: 172.22.0.3
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flicenjoyer"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  flicenjoyer:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/24
