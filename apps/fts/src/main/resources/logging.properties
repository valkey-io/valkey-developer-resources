# FlicEnjoyer logging configuration (java.util.logging)

handlers = java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# Default level
.level = INFO

# Console: INFO and above to stderr
java.util.logging.ConsoleHandler.level = INFO
java.util.logging.ConsoleHandler.formatter = java.util.logging.SimpleFormatter

# File: ALL levels to ~/.flicenjoyer/flicenjoyer.log
java.util.logging.FileHandler.pattern = %h/.flicenjoyer/flicenjoyer.log
java.util.logging.FileHandler.level = ALL
java.util.logging.FileHandler.formatter = java.util.logging.SimpleFormatter
java.util.logging.FileHandler.append = true
java.util.logging.FileHandler.limit = 5000000
java.util.logging.FileHandler.count = 1

# Timestamp format
java.util.logging.SimpleFormatter.format = %1$tF %1$tT.%1$tL %4$-7s [%3$s] %5$s%6$s%n
